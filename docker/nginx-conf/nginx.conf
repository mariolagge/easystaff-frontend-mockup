server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Repo root is mounted here. The pages, css/ and js/ live at that root.
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Keep the compose setup and VCS metadata off the site.
    location ~ /\. {
        deny all;
    }

    location ^~ /docker/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

name: easystaff-frontend-mockup

services:

  web:
    image: nginx:stable-alpine3.23-perl
    container_name: nginx_web-easystaff-frontend-mockup
    restart: always
    ports:
      - "127.0.0.1:${NGINX_PORT:-8089}:80"
    volumes:
      - ..:/usr/share/nginx/html:ro
      - ./nginx-conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 64m
